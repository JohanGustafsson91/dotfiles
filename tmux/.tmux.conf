# ============================================================
# Terminal
# ============================================================

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"


# ============================================================
# Prefix
# ============================================================

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


# ============================================================
# Panes
# ============================================================

bind-key i split-window -h -c "#{pane_current_path}"
bind-key o split-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

# Resize panes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# Toggle pane zoom
bind -r m resize-pane -Z


# ============================================================
# Ctrl+C
# ============================================================

unbind -T root C-c
bind-key -T root C-c send-keys C-c


# ============================================================
# Mouse
# ============================================================

set -g mouse on


# ============================================================
# Copy mode
# ============================================================

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Keep copy mode active after mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane


# ============================================================
# Neovim
# ============================================================

# Remove delay when leaving insert mode with ESC
set -sg escape-time 10


# ============================================================
# Status bar
# ============================================================

set-option -g status-position top


# ============================================================
# TPM
# ============================================================

set -g @plugin 'tmux-plugins/tpm'


# ============================================================
# Plugins
# ============================================================

# Navigate between tmux panes and Neovim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

# Persist tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Theme
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/default/cyan'


# ============================================================
# Resurrect / Continuum
# ============================================================

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


# ============================================================
# TPM initialization
# ============================================================

run '~/.tmux/plugins/tpm/tpm'
