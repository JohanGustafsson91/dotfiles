command=/usr/share/i3blocks/$BLOCK_NAME

separator_block_width=16
markup=none

# ============================================================
# Night Owl
# ============================================================

color=#CBE0F0


# ============================================================
# Network
# ============================================================

[network]
command=/home/johan/.config/i3/network
interval=5
color=#47FF9C
separator=true

# ============================================================
# Volume
# ============================================================

[volume]
command=/home/johan/.config/i3/volume
interval=1
signal=10
color=#9CDCFE
separator=true

# ============================================================
# CPU
# ============================================================

[cpu]
command=/home/johan/.config/i3/cpu
interval=10
separator=true

# ============================================================
# Memory
# ============================================================

[memory]
command=/home/johan/.config/i3/memory
interval=10
separator=true

# ============================================================
# Temperature
# ============================================================

[temperature]
command=/home/johan/.config/i3/temperature
interval=30
color=#FFCC66
separator=true

# ============================================================
# Disk
# ============================================================

[disk]
label=
interval=30
separator=true

# ============================================================
# Weather
# ============================================================

[weather]
command=/home/johan/.config/i3/weather
interval=3600
separator=true


# ============================================================
# Battery
# ============================================================

[battery]
command=/home/johan/.config/i3/battery
interval=30
separator=true


# ============================================================
# Time
# ============================================================

[time]
command=date '+%a %d %b  %H:%M '
interval=1
