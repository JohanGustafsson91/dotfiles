command=/usr/share/i3blocks/$BLOCK_NAME

separator_block_width=16
markup=none

# ============================================================
# Night Owl
# ============================================================

color=#CBE0F0


# ============================================================
# Network
# ============================================================

[network]
command=$HOME/.config/i3/network
interval=5
separator=true

# ============================================================
# Volume
# ============================================================

[volume]
command=$HOME/.config/i3/volume
interval=1
signal=10
separator=true

# ============================================================
# CPU
# ============================================================

[cpu]
command=$HOME/.config/i3/cpu
interval=10
separator=true

# ============================================================
# Memory
# ============================================================

[memory]
command=$HOME/.config/i3/memory
interval=10
separator=true

# ============================================================
# Temperature
# ============================================================

[temperature]
command=$HOME/.config/i3/temperature
interval=30
color=#FFCC66
separator=true

# ============================================================
# Disk
# ============================================================

[disk]
command=$HOME/.config/i3/disk
interval=30
separator=true

# ============================================================
# Weather
# ============================================================

[weather]
command=$HOME/.config/i3/weather
interval=3600
separator=true


# ============================================================
# Battery
# ============================================================

[battery]
command=$HOME/.config/i3/battery
interval=30
separator=true


# ============================================================
# Hydration reminder
# ============================================================

[hydration]
command=$HOME/.config/i3/hydration-reminder
interval=1
separator=true


# ============================================================
# Time
# ============================================================

[time]
command=date '+%a %d %b  %H:%M '
interval=1
