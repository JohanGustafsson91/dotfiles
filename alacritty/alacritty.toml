[general]
import = [
    "~/.config/alacritty/themes/themes/coolnight.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10
decorations = "Buttonless"
opacity = 1.0
blur = true

[font]
normal = { family = "MesloLGL Nerd Font Propo" }
size = 6

[cursor]
style = "Block"
unfocused_hollow = true
